cradle:
  multi:
    - path: ./
      config:
        cradle:
          stack:
            - path: ./src
              component: generative-art:lib
            - path: ./test/testsuite
              component: generative-art:test:testsuite
            - path: ./test/doctest
              component: generative-art:test:doctest
    
    - path: ./penplotting/ApollonianGasket
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/ApollonianGasket/stack.yaml
    - path: ./penplotting/Bezier
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/Bezier/stack.yaml
    - path: ./penplotting/circuits
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/circuits/stack.yaml
    - path: ./penplotting/DelaunayVoronoi
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/DelaunayVoronoi/stack.yaml
    - path: ./penplotting/dendrites
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/dendrites/stack.yaml
    - path: ./penplotting/FlowLines
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/FlowLines/stack.yaml
    - path: ./penplotting/Hatched
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/Hatched/stack.yaml
    - path: ./penplotting/Kilometer
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/Kilometer/stack.yaml
    - path: ./penplotting/PenChangeCalibration
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/PenChangeCalibration/stack.yaml
    - path: ./penplotting/PoissonDisc
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/PoissonDisc/stack.yaml
    - path: ./penplotting/Pressure
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/Pressure/stack.yaml
    - path: ./penplotting/SvgSource
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/SvgSource/stack.yaml
    - path: ./penplotting/Truchet
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/Truchet/stack.yaml
            components:
              - path: ./penplotting/Truchet/Truchet.hs
                component: penplotting-truchet:exe:penplotting-truchet
              - path: ./penplotting/Truchet/Truchetti.hs
                component: penplotting-truchet:exe:penplotting-truchetti
    - path: ./penplotting/Typography
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/Typography/stack.yaml
    - path: ./penplotting/Voronoi
      config:
        cradle:
          stack:
            stackYaml: ./penplotting/Voronoi/stack.yaml

    - path: ./showcases/circuits
      config:
        cradle:
          stack:
            stackYaml: ./showcases/circuits/stack.yaml
    - path: ./showcases/haskell_logo_billard
      config:
